<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades DPSN — Selección de módulo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="seleccion-page">
  <div class="seleccion-header">
    <div class="escudo-mini"><img src="assets/icon-001.png" alt="PNA"></div>
    <h1>¿A qué módulo querés ingresar?</h1>
    <p id="saludoUsuario">—</p>
  </div>

  <div class="tarjetas-modulo">
    <div class="tarjeta-modulo" id="tarjetaOficinas">
      <div class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="13" height="18" rx="2"></rect>
          <line x1="7.5" y1="7.5" x2="13.5" y2="7.5"></line>
          <line x1="7.5" y1="11" x2="13.5" y2="11"></line>
          <line x1="7.5" y1="14.5" x2="11" y2="14.5"></line>
          <path d="M17 6 L21.2 2.3c.5-.45 1.25-.28 1.4.4l.35 1.6c.1.45-.05.9-.4 1.2L18.6 9.2"></path>
          <path d="M17 6l1.6 3.2-2.2.5z"></path>
        </svg>
      </div>
      <h2>Oficinas DPSN</h2>
      <span class="rol-tag" id="rolOficinas">—</span>
    </div>
    <div class="tarjeta-modulo" id="tarjetaGuardias">
      <div class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8c0-2.8 2.7-5 6-5s6 2.2 6 5"></path>
          <ellipse cx="12" cy="8" rx="7.2" ry="1.4"></ellipse>
          <circle cx="12" cy="6.3" r="0.8" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="11.3" r="3"></circle>
          <path d="M4.5 21c0-3.6 3.3-6 7.5-6s7.5 2.4 7.5 6"></path>
        </svg>
      </div>
      <h2>Guardias DPSN</h2>
      <span class="rol-tag" id="rolGuardias">—</span>
    </div>
  </div>

  <div class="seleccion-footer">
    <button id="btnSalir" type="button">Cerrar sesión</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/roles.js"></script>
<script src="js/auth.js"></script>
<script>
  const usuario = requerirSesion();
  if (usuario) {
    document.getElementById('saludoUsuario').textContent =
      (usuario.jerarquia ? usuario.jerarquia + " " : "") + (usuario.nombre || usuario.dni);

    const permOf = obtenerPermiso(usuario, ModuloAcceso.OFICINAS);
    const permGu = obtenerPermiso(usuario, ModuloAcceso.GUARDIAS);

    configurarTarjeta('tarjetaOficinas', 'rolOficinas', permOf, 'oficinas');
    configurarTarjeta('tarjetaGuardias', 'rolGuardias', permGu, 'guardias');
  }

  function configurarTarjeta(idTarjeta, idRolTag, permiso, modulo) {
    const tarjeta = document.getElementById(idTarjeta);
    const rolTag = document.getElementById(idRolTag);

    if (!permiso) {
      tarjeta.classList.add('deshabilitada');
      rolTag.textContent = 'Sin acceso';
      rolTag.className = 'rol-tag lectura';
      return;
    }

    rolTag.textContent = permiso === 'admin' ? 'Administrador' : 'Solo lectura';
    rolTag.className = 'rol-tag ' + (permiso === 'admin' ? 'admin' : 'lectura');

    tarjeta.addEventListener('click', () => {
      sessionStorage.setItem('novedades_dpsn_modulo', modulo);
      window.location.href = 'dashboard.html';
    });
  }

  document.getElementById('btnSalir').addEventListener('click', cerrarSesion);
</script>
</body>
</html>
