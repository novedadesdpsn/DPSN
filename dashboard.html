<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades DPSN — Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dash">
  <div class="dash-topbar">
    <div class="marca">
      <div class="escudo-mini"><a href="https://www.argentina.gob.ar/prefecturanaval" target="_blank" rel="noopener" title="Ir a la página de Prefectura Naval Argentina"><img src="assets/icon-003-dpsn-3d.png" alt="Dirección de Policía de Seguridad de la Navegación"></a></div>
    </div>
    <div class="usuario-info">
      <button type="button" id="btnDeshacer" class="btn-topbar" disabled title="No hay cambios para deshacer">↶ Deshacer</button>
      <button type="button" id="btnRehacer" class="btn-topbar" disabled title="No hay cambios para rehacer">↷ Rehacer</button>
      <button type="button" id="btnVistaPreviaExportar" class="btn-topbar" title="Genera el PDF con lo cargado hasta ahora, solo para mirarlo — no descarga, no guarda en Drive ni archiva en el historial">Vista previa</button>
      <button type="button" id="btnExportarGlobal" class="btn-topbar btn-topbar-primario">Exportar PDF</button>

      <div class="menu-despl" id="menuLinks">
        <button type="button" class="btn-topbar" id="btnToggleLinks" title="Links de interés">
          Links de interés
          <svg class="icono-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="panel-despl oculto" id="panelLinks">
          <a href="https://gis.prefecturanaval.gob.ar/gc" target="_blank" rel="noopener" id="btnGuardacostas" class="item-despl" title="Abre en otra pestaña">
            Guardacostas 4.0
            <svg class="nota-item" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          </a>
          <button type="button" id="btnPDFsArchivados" class="item-despl oculto" onclick="abrirModalPDFsArchivados()">PDFs archivados</button>
          <button type="button" id="btnAuditoria" class="item-despl oculto" onclick="abrirModalAuditoria()">Actividad</button>
          <button type="button" id="btnRestauracion" class="item-despl" title="Puntos de restauración">Restauración</button>
        </div>
      </div>

      <div class="menu-despl" id="menuUsuario">
        <button type="button" class="btn-avatar" id="btnToggleUsuario" title="Mi cuenta">
          <span class="avatar-chip" id="avatarChip">—</span>
        </button>
        <div class="panel-despl panel-usuario oculto" id="panelUsuario">
          <div class="panel-usuario-cabecera">
            <div class="avatar-grande-wrap">
              <span class="avatar-grande" id="avatarGrande">—</span>
              <button type="button" class="avatar-editar" id="btnCambiarFoto" title="Cambiar foto de perfil">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
              </button>
              <input type="file" id="inputFotoPerfil" accept="image/*" class="oculto">
            </div>
            <div class="panel-usuario-nombre" id="nombreUsuario">—</div>
            <span class="rol-pill" id="rolPill">—</span>
          </div>
          <div class="panel-usuario-acciones">
            <button type="button" id="btnCambiarClave" class="item-despl oculto" onclick="uiCambiarContrasena()">Cambiar contraseña</button>
            <div class="divisor-despl"></div>
            <button type="button" id="btnCerrarSesion" class="item-despl item-despl-peligro">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="dash-tabs-nav" id="tabsNav"><!-- se completa por JS --></nav>

  <main class="dash-contenido">
    <div id="contenidoPanel"><!-- se completa por JS --></div>
  </main>

  <button type="button" id="fabAsistente" class="fab-asistente oculto" onclick="abrirPanelAsistente()" title="Asistente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
  </button>

  <div id="panelAsistente" class="panel-asistente oculto">
    <div class="panel-asistente-header">
      <span class="panel-asistente-titulo">Asistente virtual</span>
      <button type="button" onclick="cerrarPanelAsistente()" class="panel-asistente-cerrar">✕</button>
    </div>
    <div class="panel-asistente-cuerpo" id="asistenteCuerpo"><!-- se completa por JS --></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/roles.js"></script>
<script src="js/auth.js"></script>
<script src="js/datos-ejemplo.js"></script>
<script src="js/codigos.js"></script>
<script src="js/jerarquias.js"></script>
<script src="js/nomina.js"></script>
<script src="js/formulario-inspeccion.js"></script>
<script src="js/deshacer.js"></script>
<script src="js/datos-guardia.js"></script>
<script src="js/finalizar-guardia.js"></script>
<script src="js/restauracion.js"></script>
<script src="js/oficinas.js"></script>
<script src="js/importar-excel.js"></script>
<script src="js/auditoria.js"></script>
<script src="js/historial.js"></script>
<script src="js/dependencias.js"></script>
<script src="js/mapa-buques.js"></script>
<script src="js/estadisticas.js"></script>
<script src="js/asistente.js"></script>
<script src="js/integraciones-config.js"></script>
<script src="js/exportacion-texto.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/app.js"></script>
<script>iniciarDashboard();</script>
</body>
</html>
